name: Deploy AttackVisualizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write # push to GHCR + prune old versions

# Build -> deploy -> prune via the shared pipeline (kevlocburn/app-pipeline).
# The deploy key can only run `app-deploy attackvisualizer <sha>` on the server, which pulls
# that exact sha, health-checks it and rolls back automatically if unhealthy.
# How the app runs on the server (ports, volumes, nginx) is in the infra repo.
jobs:
  pipeline:
    uses: kevlocburn/app-pipeline/.github/workflows/deploy.yml@main
    with:
      app: attackvisualizer
      images: |
        [{"name": "attackvisualizer/attackvisualizer-frontend", "context": "frontend"},
         {"name": "attackvisualizer/attackvisualizer-api", "context": "backend", "file": "backend/Dockerfile.api"}]
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DO_KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
