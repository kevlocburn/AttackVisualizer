name: Deploy AttackVisualizer

on:
  workflow_dispatch:
  push:
    branches:
      - main

# One deploy at a time; never cancel one halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push to GHCR + prune old versions

env:
  IMAGE_FRONTEND: ghcr.io/kevlocburn/attackvisualizer/attackvisualizer-frontend
  IMAGE_API: ghcr.io/kevlocburn/attackvisualizer/attackvisualizer-api
  DROPLET: 159.65.37.6
  APP_DIR: /home/AttackVisualizer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<sha> is what gets deployed (exact, rollback-able); :latest is a
      # convenience for local `docker compose up`. provenance/sbom off = one
      # manifest per tag, so pruning old versions is safe.
      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
            ${{ env.IMAGE_FRONTEND }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push API
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.IMAGE_API }}:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          log-public-key: false

      # Pinned host key (secret DO_KNOWN_HOSTS), not ssh-keyscan — keyscan trusts
      # whatever answers on that IP.
      - name: Pin droplet host key
        env:
          KNOWN_HOSTS: ${{ secrets.DO_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server needs only these two files — no git checkout, so no GitHub
      # credential lives on the droplet.
      - name: Copy compose files to server
        run: |
          ssh root@"$DROPLET" "mkdir -p '$APP_DIR/database'"
          scp docker-compose.yml root@"$DROPLET":"$APP_DIR/docker-compose.yml"
          scp database/init.sql root@"$DROPLET":"$APP_DIR/database/init.sql"

      # .env is written from secrets over stdin (never on a command line) and
      # records IMAGE_TAG, so a manual `docker compose up -d` on the box keeps
      # running this exact build instead of drifting to :latest.
      - name: Write .env on server
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        run: |
          printf 'POSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=%s\nIMAGE_TAG=%s\n' \
            "$POSTGRES_USER" "$POSTGRES_PASSWORD" "$POSTGRES_DB" "$GITHUB_SHA" \
            | ssh root@"$DROPLET" "umask 077 && cat > '$APP_DIR/.env'"

      # Containers only. nginx (hack.kevinlockburner.com vhost, TLS) is owned by
      # kevlocburn/digital-ocean-infra; this app's contract is 127.0.0.1:3000
      # (frontend) and 127.0.0.1:8000 (api, also /ws/). `up -d` recreates only
      # services whose image/config changed — the database keeps running.
      - name: Deploy on server
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh root@"$DROPLET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh root@"$DROPLET" "APP_DIR='$APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          cd "$APP_DIR"
          docker compose pull api frontend
          docker compose up -d --remove-orphans
          docker compose ps --format '{{.Name}} {{.Image}} {{.Status}}'
          REMOTE

      # Keep the newest 10 versions of each image; never fails the deploy.
      - name: Prune old frontend versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: attackvisualizer/attackvisualizer-frontend
          package-type: container
          min-versions-to-keep: 10

      - name: Prune old API versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: attackvisualizer/attackvisualizer-api
          package-type: container
          min-versions-to-keep: 10
