services:
  database:
    image: timescale/timescaledb:latest-pg14
    container_name: timescaledb
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Loopback only: Docker's port publishing bypasses ufw, so "5432:5432" exposed
    # Postgres to the internet. Containers reach it as "timescaledb" on the compose
    # network; host scripts via 127.0.0.1. Remote access: ssh -L 5432:127.0.0.1:5432
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      bash -c "
        echo \"shared_preload_libraries = 'pg_stat_statements'\" >> /var/lib/postgresql/data/postgresql.conf;
        exec docker-entrypoint.sh postgres
      "

  api:
    image: ghcr.io/kevlocburn/attackvisualizer/attackvisualizer-api:latest
    container_name: attack_visualizer_api
    depends_on:
      database:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"   # nginx-only; see database ports comment
    restart: always  
    volumes:
      - /var/log:/host_var_log:ro

  frontend:
    image: ghcr.io/kevlocburn/attackvisualizer/attackvisualizer-frontend:latest
    container_name: attack_visualizer_frontend
    ports:
      - "127.0.0.1:3000:80"     # nginx-only; see database ports comment
    restart: always

volumes:
  pgdata:
